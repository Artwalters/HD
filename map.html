<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heerlen Doen - Ontdek Heerlen</title>
    <meta name="description" content="Ontdek de beste plekken in Heerlen - cultuur, horeca, mode en meer!">
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Three.js - Working version -->
    <script src="https://unpkg.com/three@0.126.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- Inter Font for professional look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Astronef Font for hero titles -->
    <link rel="stylesheet" href="https://use.typekit.net/som4aiu.css">
    
    <!-- CSS Styling -->
    <link rel="stylesheet" href="src/styles/variables.css">
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/main-navigation.css">
    <link rel="stylesheet" href="src/styles/popup-styles.css">
    <link rel="stylesheet" href="src/styles/filter-styles.css">
    <link rel="stylesheet" href="src/styles/preference-modal.css">
    <link rel="stylesheet" href="src/styles/navigation-styles.css">
    <link rel="stylesheet" href="src/styles/info-panel-styles.css">
</head>
<body>
    <!-- Hoofdcontainer -->
    <div id="map"></div>
    
    <!-- Info Panel wordt dynamisch geladen via template -->
    
    <!-- Performance & Configuratie -->
    <script src="src/utils/performance.js"></script>
    <script src="src/config/config.js"></script>
    
    <!-- Navigation Component -->
    <script src="src/scripts/main-navigation.js"></script>
    <script src="src/scripts/component-loader.js"></script>
    
    <!-- Utils -->
    <script src="src/utils/templateLoader.js?v=1.0"></script>
    <script src="src/utils/dataLoader.js?v=1.1"></script>
    
    <!-- Data & Definitions -->
    <script src="src/data/subcategories.js?v=1.0"></script>
    
    <!-- Components -->
    <script src="src/components/preferenceModal.js?v=1.0"></script>
    
    <!-- Managers -->
    <script src="src/managers/markerManager.js?v=1.1"></script>
    <script src="src/managers/popupManager.js?v=1.1"></script>
    <script src="src/managers/filterManager.js?v=1.8"></script>
    <script src="src/managers/controlsManager.js?v=1.1"></script>
    <script src="src/managers/locationManager.js?v=1.1"></script>
    <script src="src/managers/navigationManager.js?v=1.1"></script>
    <script src="src/managers/likesManager.js"></script>
    <script src="src/managers/threejsManager.js"></script>
    <script src="src/managers/appManager.js?v=1.1"></script>
    
    <!-- Demo script (verwijder in productie) -->
    <script src="src/utils/demo.js"></script>
    
    
    <!-- Initialize app -->
    <script>
        // Initialize app and make it globally available
        window.app = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const appManager = new AppManager();
                await appManager.initialize();
                window.app = appManager;
                window.HeerlenApp = appManager; // For backward compatibility
                console.log('🚀 HeerlenDoen app volledig geladen!');
            } catch (error) {
                console.error('❌ Fout bij initialiseren van app:', error);
            }
        });
    </script>
    
</body>
</html>
