<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heerlen Doen - Ontdek de Stad</title>
    
    <!-- Astronef Font voor Headers -->
    <link rel="stylesheet" href="https://use.typekit.net/som4aiu.css">
    
    <!-- Inter Font voor Body Text -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Three.js for 3D carousel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <link rel="stylesheet" href="src/styles/variables.css">
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/main-navigation.css">
    <link rel="stylesheet" href="src/styles/home.css">
</head>
<body>

    <!-- Hero Section -->
    <section class="hero-section" id="home">
        <div class="hero-container">
            <div class="hero-content">
                <!-- Grid Animation -->
                <div class="grid-animation-wrap">
                    <!-- Image Grids (Background) -->
                    <div class="image-grid-container image-grid-1 active" id="image-grid-1"></div>
                    <div class="image-grid-container image-grid-2" id="image-grid-2"></div>
                    <div class="image-grid-container image-grid-3" id="image-grid-3"></div>
                    <div class="image-grid-container image-grid-4" id="image-grid-4"></div>
                    
                    <!-- Overlay Grid (Animation) -->
                    <div class="overlay-grid-container" id="overlay-grid"></div>
                    
                    <!-- Right Side Gradient Overlay -->
                    <div class="grid-right-gradient"></div>
                    
                    <!-- Bottom Gradient Overlay -->
                    <div class="grid-bottom-gradient"></div>
                </div>
                
                <!-- Hero Text -->
                <div class="hero-text">
                    <h1 class="hero-title">
                        <span class="title-line" id="hero-text-0">VERRAST</span>
                        <span class="title-line" id="hero-text-1">WORDEN?</span>
                        <span class="title-line title-heerlen">HEERLEN</span>
                        <span class="title-line title-doen">DOEN</span>
                    </h1>
                </div>
            </div>
        </div>
    </section>

    <!-- Over Section -->
    <section class="over-section">
        <div class="container">
            <h2 class="section-title">OVER</h2>
            <div class="over-content">
                <p class="over-text">
                    Heerlen Doen is een initiatief van verschillende partners, 
                    organisaties van lokale ondernemers in Heerlen, 
                    met enige doel om alle highlights in te vinden 
                    die jouw interesse op en reistjger zo
                </p>
            </div>
        </div>
    </section>

    <!-- Dagje Uit Section -->
    <section class="dagje-uit-section">
        <div class="container">
            <h2 class="section-title">DAGJE UIT</h2>
            <div class="cards-grid">
                <div class="empty-card"></div>
                <div class="empty-card"></div>
                <div class="empty-card"></div>
                <div class="empty-card"></div>
            </div>
        </div>
    </section>

    <!-- Leuk om te Doen Section -->
    <section class="leuk-om-te-doen-section">
        <div class="container">
            <h2 class="section-title">LEUK OM TE DOEN</h2>
            <div class="cards-grid">
                <div class="empty-card"></div>
                <div class="empty-card"></div>
                <div class="empty-card"></div>
                <div class="empty-card"></div>
            </div>
        </div>
    </section>

    <!-- Stacked Card Section -->
    <section class="stacked-card-section">
        <div class="container">
        </div>
    </section>

    <!-- 3D Carousel Section -->
    <section class="carousel-3d-section">
        <div class="carousel-3d-title-container">
            <h2 class="carousel-3d-title">EVENTS</h2>
        </div>
        <div class="carousel-3d-container" id="carousel-3d">
            <canvas class="carousel-3d-canvas"></canvas>
            <div class="carousel-3d-overlay">
                <div class="carousel-3d-hint">Scroll of swipe om te draaien</div>
            </div>
        </div>
    </section>

    <!-- Empty Section -->
    <section class="empty-section">
        <div class="container">
            <!-- Lege sectie met hoogte -->
        </div>
    </section>

    
    <script src="src/scripts/main-navigation.js"></script>
    <script src="src/scripts/component-loader.js"></script>
    <script src="src/scripts/carousel-3d.js"></script>
    <script src="src/scripts/home.js"></script>
</body>
</html>
