<div class="step-item" data-step="{{stepIndex}}">
    <div class="step-icon">
        <span class="step-instruction-icon">{{icon}}</span>
    </div>
    <div class="step-content">
        <div class="step-instruction">{{instruction}}</div>
        <div class="step-meta">
            <span class="step-distance">{{distance}}</span>
            {{if duration}} • <span class="step-duration">{{duration}}</span>{{endif}}
        </div>
    </div>
</div>
