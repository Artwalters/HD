<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Likes - Heerlen Doen</title>
    <meta name="description" content="Bekijk al je gelikete plekken in Heerlen">
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Styling -->
    <link rel="stylesheet" href="src/styles/variables.css">
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/main-navigation.css">
    <link rel="stylesheet" href="src/styles/likes.css">
</head>
<body>
    <a href="map.html" class="back-button">← Terug naar kaart</a>
    
    <div class="container">
        <div class="header">
            <h1>❤️ Mijn Likes</h1>
            <p>Al je favoriete plekken in Heerlen op een rijtje</p>
        </div>

        <div class="actions" style="text-align: center; margin-bottom: 30px;">
            <button id="clearAllLikes" class="clear-all-btn" style="display: none;">
                🗑️ Alle likes verwijderen
            </button>
        </div>

        <div id="likesContent">
            <!-- Content wordt hier geladen -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="src/config/config.js"></script>
    <script src="src/utils/dataLoader.js"></script>
    <script src="src/managers/likesManager.js"></script>
    <script>
        // Likes pagina functionaliteit
        class LikesPage {
            constructor() {
                this.likesManager = new LikesManager();
                this.dataLoader = new DataLoader(window.HeerlenConfig);
                this.allData = null;
                this.listenersAdded = false;
            }

            async initialize() {
                try {
                    console.log('🔄 Laden likes pagina...');
                    
                    // Initialize likes manager
                    this.likesManager.initialize();
                    
                    // Laad alle data
                    this.allData = await this.dataLoader.loadAllData();
                    console.log('📊 Data geladen:', this.allData);
                    
                    // Check likes
                    const likedIds = this.likesManager.getLikedIds();
                    console.log('❤️ Liked IDs:', likedIds);
                    
                    // Setup event listeners for likes changes
                    this.setupLikesChangeListener();
                    
                    // Render likes
                    this.renderLikes();
                    
                    console.log('✅ Likes pagina geladen');
                } catch (error) {
                    console.error('❌ Fout bij laden likes pagina:', error);
                }
            }
            
            setupLikesChangeListener() {
                // Listen for likes changes from other pages
                window.addEventListener('likesChanged', (event) => {
                    console.log('🔄 Likes changed event received on likes page:', event.detail);
                    // Force reload likes and re-render
                    this.likesManager.loadLikes();
                    this.renderLikes();
                });
            }

            renderLikes() {
                const likedLocations = this.likesManager.getLikedLocations(this.allData);
                const stats = this.likesManager.getStats(this.allData);
                
                console.log('📍 Liked locations found:', likedLocations.length);
                console.log('📊 Stats:', stats);
                
                // Update statistieken
                this.updateStats(stats);
                
                // Render likes lijst
                const content = document.getElementById('likesContent');
                
                if (likedLocations.length === 0) {
                    content.innerHTML = this.renderEmptyState();
                } else {
                    content.innerHTML = `<div class="likes-grid">${
                        likedLocations.map(location => this.renderLikeCard(location)).join('')
                    }</div>`;
                }
                
                // Add event listeners only once
                if (!this.listenersAdded) {
                    this.addEventListeners();
                    this.listenersAdded = true;
                }
            }

            updateStats(stats) {
                // Show/hide clear all button based on total likes
                const clearBtn = document.getElementById('clearAllLikes');
                if (stats.total > 0) {
                    clearBtn.style.display = 'inline-block';
                } else {
                    clearBtn.style.display = 'none';
                }
            }

            renderLikeCard(location) {
                const props = location.properties;
                const categoryClass = this.getCategoryClass(props.category);
                
                return `
                    <div class="like-card" data-location-id="${props.id}">
                        <div class="card-image" style="background-image: url('./assets/images/catcute.png');">
                            <div class="card-category ${categoryClass}">${props.category}</div>
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${props.name}</h3>
                            <p class="card-description">${props.description}</p>
                            <div class="card-info">
                                <span class="card-address">${props.address || ''}</span>
                                <button class="unlike-btn" data-unlike-id="${props.id}">
                                    Unlike ❌
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderEmptyState() {
                return `
                    <div class="empty-state">
                        <h2>Nog geen likes</h2>
                        <p>Je hebt nog geen plekken geliked. Ga naar de kaart en ontdek geweldige locaties!</p>
                        <a href="map.html" class="explore-btn">Start met ontdekken</a>
                    </div>
                `;
            }

            getCategoryClass(category) {
                switch(category) {
                    case 'Cultuur': return 'category-cultuur';
                    case 'Eten & Drinken': return 'category-horeca';
                    case 'Mode': return 'category-mode';
                    default: return 'category-cultuur';
                }
            }

            addEventListeners() {
                // Unlike buttons - use event delegation
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('unlike-btn')) {
                        e.stopPropagation();
                        const locationId = e.target.dataset.unlikeId; // Don't parseInt - keep as string
                        this.unlikeLocation(locationId);
                    }
                });

                // Clear all likes button
                const clearBtn = document.getElementById('clearAllLikes');
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        this.clearAllLikes();
                    });
                }

                // Card clicks - could navigate to location on map
                document.addEventListener('click', (e) => {
                    const card = e.target.closest('.like-card');
                    if (card && !e.target.classList.contains('unlike-btn')) {
                        const locationId = card.dataset.locationId;
                        // Could implement navigation to map with this location highlighted
                        console.log('Navigate to location:', locationId);
                    }
                });
            }

            unlikeLocation(locationId) {
                this.likesManager.toggleLike(locationId);
                this.renderLikes(); // Re-render to update the list
            }

            clearAllLikes() {
                if (confirm('Weet je zeker dat je alle likes wilt verwijderen? Deze actie kan niet ongedaan worden gemaakt.')) {
                    this.likesManager.clearAllLikes();
                    this.renderLikes(); // Re-render to update the list
                    console.log('🗑️ Alle likes verwijderd');
                }
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const likesPage = new LikesPage();
            likesPage.initialize();
        });
    </script>
    
    <!-- Navigation Component -->
    <script src="src/scripts/main-navigation.js"></script>
    <script src="src/scripts/component-loader.js"></script>
    
</body>
</html>
